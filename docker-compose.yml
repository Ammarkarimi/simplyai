# Full SimplyAI stack: docker compose up --build
# Open http://localhost:3000 and sign in with admin@simplyai.dev / SimplyAI-demo1 (demo seed).
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://simplyai:simplyai@postgres:5432/simplyai?schema=public
  REDIS_URL: redis://redis:6379
  APP_URL: ${APP_URL:-http://localhost:3000}
  API_URL: ${API_URL:-http://localhost:4000}
  API_PORT: 4000
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY (openssl rand -hex 32)}
  SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET (openssl rand -hex 32)}
  S3_BUCKET: simplyai
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-simplyai}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-simplyai-secret}
  S3_FORCE_PATH_STYLE: "true"
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
  ALLOW_PRIVATE_NETWORK: ${ALLOW_PRIVATE_NETWORK:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-SimplyAI <no-reply@simplyai.local>}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-admin@simplyai.dev}

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: simplyai, POSTGRES_PASSWORD: simplyai, POSTGRES_DB: simplyai }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U simplyai"], interval: 5s, retries: 20 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER:-simplyai}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-simplyai-secret}" }
    volumes: [miniodata:/data]
    ports: ["9001:9001"]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, retries: 20 }

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} && mc mb --ignore-existing local/simplyai"]
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER:-simplyai}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-simplyai-secret}" }

  migrate:
    build: { context: ., dockerfile: docker/Dockerfile, target: migrate }
    environment: *app-env
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: docker/Dockerfile, target: api }
    environment: *app-env
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10

  worker:
    build: { context: ., dockerfile: docker/Dockerfile, target: worker }
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy: { replicas: 2 }

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args: { API_INTERNAL_URL: "http://api:4000", NEXT_PUBLIC_WS_URL: "${API_URL:-http://localhost:4000}" }
    environment: { NODE_ENV: production, API_INTERNAL_URL: "http://api:4000" }
    ports: ["3000:3000"]
    depends_on: { api: { condition: service_healthy } }

volumes:
  pgdata:
  redisdata:
  miniodata:
